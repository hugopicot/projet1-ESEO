<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Liste d'attente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/waitlist.css">
  <script src="../js/script.js"></script>
</head>
<body>
    <!-- Hero -->
    <section class="hero">
        <div>
            <div>
                <p class="hero-tag">
                    Obtenir un accès anticipé
                </p>
            </div>
            <div>
                <p class="hero-title">
                    Réservez votre place dès aujourd'hui
                </p>
            </div>
            <div>
                <p class="hero-text">
                    Rejoignez notre liste d'attente et obtenez un accès anticipé à nos produits et services.
                </p>
            </div>
            
            <!-- Formulaire d'email -->
            <div class="email-form-container">
                <form class="email-form" id="waitlist-form">
                    <div class="form-group">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Your email address" 
                            required
                            class="email-input"
                        >
                        <button type="submit" class="join-btn">Join Now</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
