<!doctype html>
<!-- 
   PAGE WAITLIST - Nova
   ===================
   Page dédiée à l'inscription sur la liste d'attente Nova.
   Structure simplifiée focalisée sur la conversion utilisateur.
   Technologies : HTML5, CSS personnalisé, JavaScript avec API DummyJSON
-->
<html lang="fr">
<head>
  <!-- Configuration de base du document -->
  <meta charset="utf-8">                    <!-- Encodage UTF-8 pour caractères spéciaux -->
  <title>Liste d'attente</title>            <!-- Titre de la page pour SEO -->
  
  <!-- Importation des polices Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">     <!-- Préconnexion pour performance -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Feuilles de style personnalisées -->
  <link rel="stylesheet" href="../css/styles.css">      <!-- Styles globaux partagés -->
  <link rel="stylesheet" href="../css/waitlist.css">    <!-- Styles spécifiques à cette page -->
  
  <!-- Script principal pour la logique métier -->
  <!-- Logique d'interface (validation + fetch DummyJSON + notifications) -->
  <script src="../js/script.js"></script>
</head>

<!-- Corps de la page waitlist -->
<body>
    <!-- 
       SECTION HERO - Zone principale de conversion
       ===========================================
       Section centrée sur l'inscription avec design minimaliste
       pour maximiser le taux de conversion
    -->
    <section class="hero">
        <div>
            <!-- Tag d'accroche - Proposition de valeur immédiate -->
            <div>
                <p class="hero-tag">
                    Obtenir un accès anticipé
                </p>
            </div>
            
            <!-- Titre principal - Message de conversion -->
            <div>
                <p class="hero-title">
                    Réservez votre place dès aujourd'hui
                </p>
            </div>
            
            <!-- Description - Bénéfices et rassurance -->
            <div>
                <p class="hero-text">
                    Rejoignez notre liste d'attente et obtenez un accès anticipé à nos produits et services.
                </p>
            </div>
            
            <!-- 
               FORMULAIRE D'INSCRIPTION
               ========================
               Formulaire simple avec validation côté client et envoi API
            -->
            <div class="email-form-container">
                <!-- Formulaire avec ID pour ciblage JavaScript -->
                <form class="email-form" id="waitlist-form">
                    <div class="form-group">
                        <!-- 
                           Champ email avec validation HTML5 et JavaScript
                           - type="email" : validation native du navigateur
                           - required : champ obligatoire
                           - placeholder en anglais pour cohérence design
                        -->
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Your email address" 
                            required
                            class="email-input"
                        >
                        
                        <!-- 
                           Bouton de soumission
                           - type="submit" : déclenche l'événement submit du formulaire
                           - Le clic déclenche l'envoi vers DummyJSON (voir js/script.js)
                        -->
                        <button type="submit" class="join-btn">Join Now</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
